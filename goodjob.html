<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💗</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  width: 100vw;
  background: linear-gradient(to top, #ffdde1, #ee9ca7);
  overflow: hidden;
  font-family: "Segoe UI", sans-serif;
}

/* FLOATING SCENE */
.scene {
  position: absolute;
  inset: 0;
  animation: float 5s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(15px); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(15px); }
}

/* HEART BALLOON */
.heart {
  position: absolute;
  top: 10%;
  left: 50%;
  width: 120px;
  height: 120px;
  background: #ff5e78;
  transform: translateX(-50%) rotate(-45deg);
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 120px;
  height: 120px;
  background: #ff5e78;
  border-radius: 50%;
}

.heart::before {
  top: -60px;
  left: 0;
}

.heart::after {
  left: 60px;
  top: 0;
}

/* ROPE */
.rope {
  position: absolute;
  top: 22%;
  left: 50%;
  width: 3px;
  height: 180px;
  background: #444;
}

/* PEOPLE */
.person {
  position: absolute;
  bottom: 20%;
  width: 22px;
  height: 80px;
  background: #444;
  border-radius: 10px;
}

.person::before {
  content: "";
  position: absolute;
  top: -28px;
  left: -9px;
  width: 40px;
  height: 40px;
  background: #ffd1b3;
  border-radius: 50%;
}

.boy {
  left: calc(50% - 45px);
}

.girl {
  left: calc(50% + 25px);
  background: #555;
}

/* CLOUDS */
.cloud {
  position: absolute;
  background: #ffdce5;
  border-radius: 50px;
  opacity: 0.7;
  animation: cloudMove 20s linear infinite;
}

.cloud1 {
  width: 200px;
  height: 60px;
  top: 20%;
  left: -250px;
}

.cloud2 {
  width: 260px;
  height: 80px;
  top: 35%;
  left: -300px;
  animation-delay: 6s;
}

@keyframes cloudMove {
  from { transform: translateX(0); }
  to { transform: translateX(140vw); }
}

/* MESSAGE */
.message {
  position: absolute;
  bottom: 8%;
  width: 100%;
  text-align: center;
  font-size: 1.6rem;
  color: #fff;
  letter-spacing: 1px;
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="scene">

  <div class="heart"></div>
  <div class="rope"></div>

  <div class="person boy"></div>
  <div class="person girl"></div>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

</div>

<div class="message">
  Thank you for being amazing 💖
</div>

</body>
</html>
