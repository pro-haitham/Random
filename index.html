<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
    /* --- Cute Pastel Styling --- */
    body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(180deg, #a1c4fd 0%, #c2e9fb 100%);
        height: 100vh;
        font-family: 'Nunito', sans-serif;
        cursor: crosshair;
        user-select: none;
    }

    /* Clouds Background */
    .cloud {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        opacity: 0.8;
        animation: floatCloud linear infinite;
        z-index: 1;
    }

    @keyframes floatCloud {
        from { transform: translateX(-200px); }
        to { transform: translateX(110vw); }
    }

    /* The Balloon */
    .balloon {
        position: absolute;
        bottom: -150px;
        width: 60px;
        height: 70px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
        box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        transition: transform 0.1s;
    }
    
    .balloon::after {
        content: '';
        position: absolute;
        bottom: -10px;
        width: 2px;
        height: 40px;
        background: rgba(255,255,255,0.6);
    }

    .balloon:active { transform: scale(0.9); }

    /* The Note Card (Modal) */
    #card-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: white;
        padding: 30px;
        width: 80%;
        max-width: 350px;
        border-radius: 25px;
        box-shadow: 0 15px 50px rgba(50,50,93,0.15);
        z-index: 100;
        text-align: center;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none; /* Ignore clicks when hidden */
    }

    #card-container.active {
        transform: translate(-50%, -50%) scale(1);
        pointer-events: auto;
    }

    h2 {
        font-family: 'Fredoka One', cursive;
        color: #ff80ab;
        margin-bottom: 10px;
        font-size: 2rem;
    }

    p { font-size: 1.2rem; color: #555; line-height: 1.5; }

    button {
        background: #80d8ff;
        border: none;
        padding: 10px 25px;
        border-radius: 20px;
        color: white;
        font-weight: bold;
        margin-top: 20px;
        cursor: pointer;
        font-size: 1rem;
        box-shadow: 0 4px 0 #40c4ff;
        transition: transform 0.1s;
    }

    button:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 #40c4ff;
    }

    /* Confetti Particles */
    .particle {
        position: absolute;
        width: 8px;
        height: 8px;
        pointer-events: none;
        z-index: 99;
    }

    /* Title Overlay */
    #title {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        font-family: 'Fredoka One', cursive;
        color: white;
        font-size: 1.5rem;
        text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        z-index: 5;
        pointer-events: none;
    }
</style>
</head>
<body>

    <div id="title">Pop a balloon! 🎈</div>
    <div id="sky"></div>

    <div id="card-container">
        <h2 id="card-title">Yay!</h2>
        <p id="card-text">You are amazing.</p>
        <button onclick="closeCard()">Keep Popping</button>
    </div>

<script>
    const sky = document.getElementById('sky');
    const colors = ['#ff80ab', '#ff9e80', '#ea80fc', '#8c9eff', '#80d8ff', '#a7ffeb', '#ccff90', '#ffd180'];
    
    // --- EDIT THESE MESSAGES ---
    const messages = [
        "Thank you for being the best listener.",
        "You make life so much more colorful.",
        "I appreciate your advice (even when I don't take it!).",
        "Thanks for all the laughs.",
        "You have such a kind heart.",
        "To many more memories together!",
        "You are seriously the coolest.",
        "Thank you for being YOU."
    ];

    // 1. Create Clouds
    for (let i = 0; i < 6; i++) {
        let cloud = document.createElement('div');
        cloud.classList.add('cloud');
        let size = Math.random() * 100 + 50;
        cloud.style.width = size * 1.5 + 'px';
        cloud.style.height = size + 'px';
        cloud.style.top = Math.random() * 100 + 'vh';
        cloud.style.animationDuration = (Math.random() * 20 + 20) + 's';
        cloud.style.opacity = Math.random() * 0.5 + 0.3;
        sky.appendChild(cloud);
    }

    // 2. Balloon Logic
    function spawnBalloon() {
        const balloon = document.createElement('div');
        balloon.classList.add('balloon');
        
        // Random Color
        const color = colors[Math.floor(Math.random() * colors.length)];
        balloon.style.background = `radial-gradient(circle at 30% 30%, #fff, ${color})`;
        
        // Random Position
        balloon.style.left = Math.random() * 90 + 'vw';
        
        // Random Speed
        let duration = Math.random() * 5 + 5; // 5 to 10 seconds
        balloon.style.transition = `bottom ${duration}s linear`;
        
        // Interaction
        balloon.addEventListener('click', (e) => {
            popBalloon(e.clientX, e.clientY, color);
            balloon.remove();
            showCard();
        });

        sky.appendChild(balloon);

        // Start floating
        setTimeout(() => {
            balloon.style.bottom = '110vh';
        }, 100);

        // Cleanup
        setTimeout(() => {
            if(balloon.parentNode) balloon.remove();
        }, duration * 1000);
    }

    // Spawn balloons continuously
    setInterval(spawnBalloon, 800);


    // 3. Pop Effect (Confetti)
    function popBalloon(x, y, color) {
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.background = color;
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            // Random direction
            const destX = (Math.random() - 0.5) * 300;
            const destY = (Math.random() - 0.5) * 300;
            const rot = Math.random() * 360;

            particle.style.transition = 'all 1s ease-out';
            
            sky.appendChild(particle);

            setTimeout(() => {
                particle.style.transform = `translate(${destX}px, ${destY}px) rotate(${rot}deg)`;
                particle.style.opacity = 0;
            }, 10);

            setTimeout(() => {
                particle.remove();
            }, 1000);
        }
    }

    // 4. Message Card Logic
    const card = document.getElementById('card-container');
    const cardText = document.getElementById('card-text');

    function showCard() {
        // Pick a random message
        const text = messages[Math.floor(Math.random() * messages.length)];
        cardText.innerText = text;
        card.classList.add('active');
    }

    function closeCard() {
        card.classList.remove('active');
    }
</script>
</body>
</html>
